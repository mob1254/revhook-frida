name: CI-Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
      - uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - name: Test Build
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease
      - name: Get Module Version
        id: module-version
        run: |
          MODULE_VERSION=$(cat module.gradle | grep "moduleVersion =" | awk -F'"' '{print $2}')
          echo "version=$MODULE_VERSION" >> "$GITHUB_OUTPUT"
          ls -la out || true
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: RevhookFrida-${{ steps.module-version.outputs.version }}-release
          path: out/RevhookFrida-${{ steps.module-version.outputs.version }}-zygisk-release.zip
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: RevhookFrida-${{ steps.module-version.outputs.version }}-riru-release
          path: out/RevhookFrida-${{ steps.module-version.outputs.version }}-riru-release.zip
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.module-version.outputs.version }}"
          TAG="$VERSION"
          ZYGISK="out/RevhookFrida-${VERSION}-zygisk-release.zip"
          RIRU="out/RevhookFrida-${VERSION}-riru-release.zip"
          test -f "$ZYGISK" && test -f "$RIRU"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZYGISK" "$RIRU" --clobber
          else
            gh release create "$TAG" "$ZYGISK" "$RIRU" --title "$TAG" --notes "Revhook Frida $TAG"
          fi
